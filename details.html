<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Classroom Monitoring System</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Segoe UI',sans-serif;
background:linear-gradient(135deg,#667eea,#764ba2);
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
}

.container{
width:950px;
background:white;
padding:25px;
border-radius:16px;
box-shadow:0 10px 25px rgba(0,0,0,0.2);
}

h1{
text-align:center;
font-size:30px;
margin-bottom:5px;
color:#333;
}

h2{
text-align:center;
font-size:18px;
margin-bottom:25px;
color:#666;
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:25px;
}

.column{
display:flex;
flex-direction:column;
}

label{
margin-top:12px;
font-weight:600;
color:#444;
}

input,
select,
textarea{
margin-top:5px;
padding:10px;
border-radius:8px;
border:1px solid #ccc;
font-size:15px;
outline:none;
}

textarea{
resize:none;
height:100px;
}

.readonly{
background:#ececec;
}

button{
margin-top:25px;
padding:12px;
border:none;
border-radius:10px;
font-size:16px;
cursor:pointer;
background:#6a11cb;
color:white;
font-weight:bold;
transition:0.3s;
}

button:hover{
transform:scale(1.02);
}

#lastSaved{
margin-top:15px;
text-align:center;
font-size:14px;
color:#444;
}

.logoutBtn{
position:fixed;
left:10px;
bottom:10px;
padding:8px 14px;
background:#c2185b;
color:white;
border:none;
border-radius:6px;
font-size:12px;
cursor:pointer;
width:auto;
}

.logoutBtn:hover{
background:#ad1457;
}

@media(max-width:850px){

.grid{
grid-template-columns:1fr;
}

.container{
width:100%;
}

}

</style>
</head>

<body>

<div class="container">

<h1>RAMCO INSTITUTE OF TECHNOLOGY</h1>
<h2>Classroom Monitoring System</h2>

<div class="grid">

<div class="column">

<label>Hall Number</label>
<select id="code"></select>

<label>Classroom Allotted</label>
<input type="text" id="className" class="readonly" readonly>

<label>Student Strength</label>
<input type="text" id="strength" class="readonly" readonly>

<label>Bench Available</label>
<input type="text" id="benches" class="readonly" readonly>

<label>Class Advisor</label>
<textarea id="advisor" class="readonly" readonly></textarea>

<label>Mentor Details</label>
<textarea id="mentor" class="readonly" readonly></textarea>

</div>

<div class="column">

<label>Classroom Status</label>
<select id="status">
<option>Available</option>
<option>Occupied</option>
</select>

<label>CPU Status</label>
<select id="cpu">
<option>Working</option>
<option>Not Working</option>
</select>

<label>Projector Status</label>
<select id="projector">
<option>Working</option>
<option>Not Working</option>
</select>

<label>Battery Status</label>
<select id="battery">
<option>Working</option>
<option>Not Working</option>
</select>

<button id="saveBtn">Save Details</button>

<div id="lastSaved">Last Saved : ---</div>

</div>

</div>

</div>

<button class="logoutBtn" onclick="logout()">Logout</button>

<script>

let password = prompt("Enter Password");

password = password ? password.toUpperCase().trim() : "";

let role = "Student";

if(password === "ADMIN.RIT"){
role = "Admin";
}
else if(password === "STAFF.RIT"){
role = "Staff";
}
else if(password === "RIT"){
role = "Student";
}
else{
alert("Invalid Password");
role = "Student";
}

const classroomData = {

"A1L03":{
name:"First Year CSE B",
strength:63,
benches:32,
advisor:"Mrs. S. Manjula",
mentor:"Dr. K. Vijayalakshmi\nMrs. S. Manjula"
},

"A1L04":{
name:"First Year AIML",
strength:63,
benches:32,
advisor:"Mrs. K. Priya",
mentor:"Dr. R. Venkatesh\nDr. G. Kanthimathi"
},

"A2L05":{
name:"First Year MECH",
strength:30,
benches:15,
advisor:"Dr. S. Maharajan",
mentor:"Mr. C. Gururaj\nDr. M. Ashokkumar"
}

};

const code = document.getElementById("code");
const className = document.getElementById("className");
const strength = document.getElementById("strength");
const benches = document.getElementById("benches");
const advisor = document.getElementById("advisor");
const mentor = document.getElementById("mentor");

const status = document.getElementById("status");
const cpu = document.getElementById("cpu");
const projector = document.getElementById("projector");
const battery = document.getElementById("battery");

const saveBtn = document.getElementById("saveBtn");
const lastSaved = document.getElementById("lastSaved");

for(let room in classroomData){

code.innerHTML += `
<option value="${room}">
${room} - ${classroomData[room].name}
</option>
`;

}

function loadClassroom(room){

const data = classroomData[room];

className.value = data.name;
strength.value = data.strength;
benches.value = data.benches;
advisor.value = data.advisor;
mentor.value = data.mentor;

let saved = JSON.parse(localStorage.getItem(room));

if(saved){

status.value = saved.status;
cpu.value = saved.cpu;
projector.value = saved.projector;
battery.value = saved.battery;

lastSaved.innerHTML =
"Last Saved : " + saved.time;

}
else{

status.value = "Available";
cpu.value = "Working";
projector.value = "Working";
battery.value = "Working";

lastSaved.innerHTML =
"Last Saved : ---";

}

}

code.addEventListener("change",function(){
loadClassroom(this.value);
});

code.value = Object.keys(classroomData)[0];
loadClassroom(code.value);

if(role === "Student"){

status.disabled = true;
cpu.disabled = true;
projector.disabled = true;
battery.disabled = true;

saveBtn.style.display = "none";

}

saveBtn.addEventListener("click",function(){

if(role === "Student"){
alert("Read Only Access");
return;
}

let data = {

status:status.value,
cpu:cpu.value,
projector:projector.value,
battery:battery.value,
time:new Date().toLocaleString()

};

localStorage.setItem(code.value,JSON.stringify(data));

lastSaved.innerHTML =
"Last Saved : " + data.time;

alert("Saved Successfully");

});

function logout(){

localStorage.clear();

document.body.innerHTML = `
<div style="
height:100vh;
display:flex;
justify-content:center;
align-items:center;
font-family:Segoe UI;
font-size:28px;
background:black;
color:white;
">
Logged Out Successfully
</div>
`;

setTimeout(() => {
location.reload();
},1000);

}

</script>

</body>
</html>
